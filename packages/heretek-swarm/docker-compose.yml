version: "3.8"

x-common-env: &common-env
  HERETEK_LOG_LEVEL: ${HERETEK_LOG_LEVEL:-INFO}
  HERETEK_HOME: /app/heretek_data
  ENVIRONMENT: ${ENVIRONMENT:-development}

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 10s

services:
  # =============================================================================
  # Infrastructure Services
  # =============================================================================

  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 2g
    cpus: "1.0"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-heretek_swarm}"]
    restart: unless-stopped
    networks:
      - heretek-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    mem_limit: 1g
    cpus: "0.5"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "redis-cli", "ping"]
    restart: unless-stopped
    networks:
      - heretek-net

  qdrant:
    image: qdrant/qdrant:v1.9.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    mem_limit: 2g
    cpus: "1.0"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333; echo -e \"GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n\" >&3; grep -q \"200\" <&3'"]
    restart: unless-stopped
    networks:
      - heretek-net

  nats:
    image: nats:alpine
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-c", "/etc/nats/nats-server.conf"]
    volumes:
      - nats_data:/data
      - ./nats-server.conf:/etc/nats/nats-server.conf:ro,z
      - ./certs:/etc/nats/certs:ro,z
    mem_limit: 512m
    cpus: "0.5"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "nc -z localhost 4222 || exit 1"]
    restart: unless-stopped
    networks:
      - heretek-net

  # =============================================================================
  # Cognee — Memory control plane (M-arch PR #1: sidecar, no integration yet)
  # =============================================================================
  # Runs alongside the Heretek API but is NOT depended on by it. Used to validate
  # Cognee's behavior under production traffic for 1 week before any custom memory
  # code is deleted. See PLAN.md §M-arch PR #1.

  cognee:
    image: cognee/cognee:1.1.2
    environment:
      LLM_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY must be set}
      LLM_MODEL: ${LLM_MODEL:-MiniMax-M2.7}
      LLM_PROVIDER: openai
      LLM_ENDPOINT: ${OPENAI_BASE_URL:-https://api.minimax.io/v1}
      VECTOR_DB_PROVIDER: pgvector
      VECTOR_DB_HOST: postgres
      VECTOR_DB_PORT: "5432"
      VECTOR_DB_USERNAME: ${POSTGRES_USER:-postgres}
      VECTOR_DB_PASSWORD: ${POSTGRES_PASSWORD}
      VECTOR_DB_NAME: ${POSTGRES_DB:-heretek_swarm}
      GRAPH_DATABASE_PROVIDER: kuzu
      ENABLE_BACKEND_ACCESS_CONTROL: "false"
    volumes:
      - cognee_data:/data/cognee
    mem_limit: 1g
    cpus: "0.5"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_started
    networks:
      - heretek-net

  # =============================================================================
  # Consensus gRPC Service (Phase 5.1) — optional extraction
  # =============================================================================
  # Phase 5 of PLAN.md (§1.13) recommends extracting the
  # consensus engine into a gRPC service when p99 latency
  # in the monolith is unacceptable. The container runs
  # heretek-swarm/services/grpc_servers.py with --service
  # consensus on port 50051. The api process picks this up
  # when HERETEK_CONSENSUS_GRPC_URL=consensus_svc:50051 is
  # set; without that env var, the api uses the in-process
  # ConsensusServiceStub. Uncomment to activate.
  consensus_svc:
    build:
      context: .
      dockerfile: backend/Dockerfile.grpc-svc
      args:
        SERVICE: consensus
    environment:
      <<: *common-env
      HERETEK_API_KEY: ${HERETEK_API_KEY:?HERETEK_API_KEY must be set}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
    ports:
      - "50051:50051"
    mem_limit: 512m
    cpus: "0.5"
    profiles: ["sovereign"]  # opt-in via `docker compose --profile sovereign`
    networks:
      - heretek-net

  # =============================================================================
  # API Service — 23 spawned agents
  # =============================================================================

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      <<: *common-env
      HERETEK_API_KEY: ${HERETEK_API_KEY:?HERETEK_API_KEY must be set}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      QDRANT_HOST: ${QDRANT_HOST:-qdrant}
      QDRANT_PORT: ${QDRANT_PORT:-6333}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      HERETEK_NATS_URL: ${HERETEK_NATS_URL:-nats://nats:4222}
      HERETEK_MTLS_ENABLED: ${HERETEK_MTLS_ENABLED:-false}
      NATS_TLS_CA_FILE: /etc/nats/certs/ca.crt
      NATS_TLS_CERT_FILE: /etc/nats/certs/agent.crt
      NATS_TLS_KEY_FILE: /etc/nats/certs/agent.key
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-heretek-swarm}
      JWT_ISSUER: ${JWT_ISSUER:-heretek-swarm}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.minimax.io/v1}
      LLM_MODEL: ${LLM_MODEL:-MiniMax-M2.7}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set (comma-separated list)}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai_compatible}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://127.0.0.1:13305/api/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-lemonade}
      EMBEDDER_MODEL: ${EMBEDDER_MODEL:-nomic-embed-text-v2-moe-GGUF}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      # Phase 5 sovereign-service wire-up (PLAN.md P3 #16).
      # When the 'sovereign' profile brings the gRPC sidecars up,
      # the api process picks them up here. When the env vars are
      # unset (default), the api falls back to the in-process
      # ConsensusServiceStub / MemoryStore / ConnectionManager /
      # opik_compat shim.
      HERETEK_CONSENSUS_GRPC_URL: ${HERETEK_CONSENSUS_GRPC_URL:-}
      HERETEK_MEMORY_GRPC_URL: ${HERETEK_MEMORY_GRPC_URL:-}
      HERETEK_REALTIME_GRPC_URL: ${HERETEK_REALTIME_GRPC_URL:-}
      HERETEK_OBSERVABILITY_GRPC_URL: ${HERETEK_OBSERVABILITY_GRPC_URL:-}
    volumes:
      - config_keys:/config
      - ./certs:/etc/nats/certs:ro,z
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      nats:
        condition: service_started
    mem_limit: 4g
    cpus: "2.0"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/health"]
    restart: unless-stopped
    networks:
      - heretek-net

  # =============================================================================
  # Dashboard — React frontend
  # =============================================================================

  dashboard:
    build:
      context: ./swarm-dashboard
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_API_HOST: ${VITE_API_HOST:-http://localhost:8000}
    ports:
      - "3000:80"
    environment:
      <<: *common-env
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_API_HOST: ${VITE_API_HOST:-http://localhost:8000}
    depends_on:
      - api
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.5"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-sf", "http://localhost:80/"]
    networks:
      - heretek-net

  # =============================================================================
  # FalkorDB — optional graph store
  # =============================================================================
  falkordb:
    image: falkordb/falkordb:v4.0.6
    profiles: ["falkordb", "graph-stores"]
    ports:
      - "6379:6379"
    volumes:
      - falkordb_data:/data
    mem_limit: 1g
    cpus: "0.5"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "falkordb-cli", "PING"]
    restart: unless-stopped
    networks:
      - heretek-net

# =============================================================================
# Volumes
# =============================================================================

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  nats_data:
  cognee_data:
  falkordb_data:
  config_keys:

# ============================================================================
# Networks
# ============================================================================

networks:
  heretek-net:
    driver: bridge
