[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heretek-swarm"
version = "0.2.0"
description = "Heretek Swarm v2.0 - Next-generation multi-agent system built on Swarms framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Heretek AI", email = "engineering@heretek.ai"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.13.4",
    "httpx>=0.28.1",
    "redis>=8.0.0",
    "qdrant-client>=1.18.0",
    "opentelemetry-api>=1.42.1",
    "opentelemetry-sdk>=1.42.1",
    "opentelemetry-exporter-otlp>=1.42.1",
    "structlog>=25.5.0",
    "tenacity>=9.1.4",
    "circuitbreaker>=2.1.3",
    "starlette>=1.2.1",
    "uvicorn>=0.48.0",
    "websockets>=16.0",
    "mem0ai>=2.0.4",
    "fastapi>=0.136.3",
    "click>=8.4.1",
    "prometheus-client>=0.25.0",
    "nats-py>=2.14.0",
    "cryptography>=48.0.0",
    "PyJWT>=2.13.0",
    "asyncpg>=0.31.0",
    "psycopg2-binary>=2.9.12",
    "pypdf>=6.12.2,<7.0.0",
    "aiohttp>=3.14.0",
    "cognee>=1.1.2,<2.0",
    "setuptools>=68.0",
    "slowapi>=0.1.9",
    "limits>=5.8.0",
    "opik>=1.0.0",
    "instructor>=1.15.0",
    "rich>=14.0.0",
    "rich-click>=1.8.0",
    "questionary>=2.0.0",
    "taskiq>=0.12.0",
    "taskiq-nats>=0.6.0",
    "fastapi-users[sqlalchemy]>=15.0.0",
    "casbin>=1.0.0",
    "mcp>=1.0.0",
    "pydantic-ai>=0.8.1",
    "psutil>=7.2.2",
]

[project.optional-dependencies]
core = [
    "pydantic>=2.13.4",
    "structlog>=25.5.0",
    "tenacity>=9.1.4",
    "circuitbreaker>=2.1.3",
]
agents = [
    "heretek-swarm[core]",
    "starlette>=1.2.1",
    "uvicorn>=0.48.0",
    "websockets>=16.0",
    "fastapi>=0.136.3",
    "click>=8.4.1",
    "httpx>=0.28.1",
    "mem0ai>=2.0.4",
    "redis>=8.0.0",
    "qdrant-client>=1.18.0",
    "opentelemetry-api>=1.42.1",
    "opentelemetry-sdk>=1.42.1",
    "opentelemetry-exporter-otlp>=1.42.1",
]
perception = [
    # Document perception libraries for PDF, DOCX, XLSX extraction
    "PyPDF2>=3.0.1",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
]
postgres = [
    # Postgres-backed event store (optional)
    "asyncpg>=0.31.0",
]
full = [
    "heretek-swarm[agents]",
    # Extended observability
    "opentelemetry-instrumentation-fastapi>=0.53b0",
    "opentelemetry-instrumentation-httpx>=0.53b0",
]
dev = [
    "heretek-swarm[full]",
    # Database drivers (for observability/db_timing tests)
    "sqlalchemy>=2.0.50",
    "aiosqlite>=0.22.1",
    # Testing
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "pytest-benchmark>=5.2.3",
    "pytest-mock>=3.15.1",
    "pytest-env>=1.6.0",
    "hypothesis>=6.155.1",
    # Coverage
    "coverage[toml]>=7.14.1",
    # Code Quality
    "ruff>=0.15.15",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    # Load Testing
    "locust>=2.44.1",
    "locust-plugins>=5.0.0",
    # Observability Testing
    "testcontainers>=4.14.2",
    # Secrets management (SOPS CLI is a Go binary — install separately:
    #   https://github.com/getsops/sops/releases)
    #   pip's 'sops' package is a boto3/KMS library, NOT Mozilla SOPS.
    #   The real binary provides `sops --encrypt` / `sops --decrypt`.
]
slowapi = [
    "slowapi>=0.1.9",
    "limits>=5.8.0",
]
langgraph = [
    "langgraph>=1.2.4",
    "langchain-core>=1.4.0",
    "langgraph-checkpoint-postgres>=3.1.0",
    "psycopg[binary,pool]>=3.3.4",
]
# SOPS is a Go binary, not a pip package.  Install:
#   curl -sLo ~/.local/bin/sops https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64
#   chmod +x ~/.local/bin/sops
# Age (encryption backend):
#   curl -sLo age.tar.gz https://github.com/FiloSottile/age/releases/download/v1.2.0/age-v1.2.0-linux-amd64.tar.gz
#   tar xzf age.tar.gz && cp age/age-keygen age/age ~/.local/bin/

[project.scripts]
heretek-swarm = "heretek_swarm.cli:cli"

[project.urls]
Homepage = "https://github.com/heretek-ai/heretek-swarm"
Documentation = "https://github.com/heretek-ai/heretek-swarm/tree/main/docs"
Repository = "https://github.com/heretek-ai/heretek-swarm"
Issues = "https://github.com/heretek-ai/heretek-swarm/issues"

[tool.setuptools.packages.find]
where = ["backend", "."]
include = ["heretek_swarm*", "research*"]

# ============== UV RESOLUTION OVERRIDES ==============
# cognee>=1.1.0 requires pypdf>=6.6.2,<7.0.0 and tenacity>=9.0.0;
# pypdf 5.1.0 (older) has known CVEs. Pin the security-patched pypdf
# and the newer tenacity so the resolver stays satisfied.
[tool.uv]
override-dependencies = [
    "pypdf>=6.12.2,<7.0.0",
    "tenacity>=9.1.4",
    # cognee<2.0 pins websockets<16 and limits<5; the heretek-swarm
    # root deps ask for >=16.0 / >=5.8.0.  Force the cognee-compatible
    # versions so the resolver stays satisfied.
    "websockets<16",
    "limits<5",
    # guardrails-ai<0.10 pins faker<38 and rich<14 while
    # heretek-swarm[dev] wants faker>=40.21.0 and root wants
    # rich>=14.0.0.  Force versions that satisfy both.
    "faker>=25.2.0,<39.0.0",
    "rich>=13.6.0",
]

# ============== WORKSPACE (Phase 4 of PLAN.md) ==============
# The audit's Phase 4 calls for splitting the single pip package
# into a 2-package monorepo: heretek-swarm-core (actors, mixins,
# base, memory, consensus, gateway, runtime, llm, embeddings,
# models, schemas, swarm_logging, config lib portion, utils,
# validation, channels) and heretek-swarm-api (api, observability
# router portion, security auth portion, mcp, integrations,
# plugins, rag orchestration-specific bits).
#
# The split is set up here as a uv workspace. The current
# single-package layout continues to work — the existing
# heretek_swarm package is still the only built member today.
# The packages/core and packages/api directories are stubs for
# the future split; activating them is a follow-up that requires
# moving the relevant sub-packages from backend/heretek_swarm/
# into the new locations and updating imports.
#
# Until the split is complete, members = [] is correct (no
# workspace members; the existing single package is the build
# target). When the split lands, this becomes:
#   members = ["packages/core", "packages/api"]
[tool.uv.workspace]
members = ["packages/core", "packages/api"]

# ============== PYTEST CONFIGURATION ==============
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    # The AutonomousSwarm's real agent instances create aiohttp.ClientSession
    # objects in background tasks during initialize().  test_deliberation_flow.py
    # terminates the supervisor, but the session GC races with pytest's
    # teardown check on Python 3.14.  This is harmless — sessions are unused
    # in no_infra mode.
    "ignore::ResourceWarning",
]
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
    "-m",
    "not integration",
]
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (require external services)",
    "load: Load/performance tests",
    "slow: Tests that take >5s",
    "a2a: Agent-to-Agent messaging tests",
    "consensus: Consensus mechanism tests",
    "latency: Latency benchmark tests (<100ms baseline)",
    "bench: Benchmark tests (pytest-benchmark throughput)",
    "security: Security-focused tests",
]

[tool.pytest-asyncio]
mode = "auto"

