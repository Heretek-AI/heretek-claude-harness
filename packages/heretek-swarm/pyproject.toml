[tool.ruff.lint.isort]
known-first-party = ["heretek_swarm"]
known-third-party = ["pytest", "pydantic", "opentelemetry"]

# ============== MYPY CONFIGURATION ==============
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true

[[tool.mypy.overrides]]
module = ["tests.*", "tests"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = "heretek_swarm.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
disallow_any_generics = false
disallow_untyped_calls = false
warn_return_any = false
warn_no_return = false
warn_unreachable = false
warn_unused_ignores = false
no_implicit_optional = false
disable_error_code = ["attr-defined", "union-attr", "misc", "assignment", "arg-type", "call-arg", "override", "operator", "index", "var-annotated", "return-value", "valid-type", "import-not-found", "import-untyped", "unused-coroutine", "no-redef", "func-returns-value", "type-var", "truthy-function", "comparison-overlap", "dict-item", "has-type", "literal-required", "name-defined", "no-any-return", "type-arg", "call-overload", "list-item"]

[tool.bandit]
exclude_dirs = [".roo", "agent_workspace", ".benchmarks", ".dist-rig", "tests"]
skips = ["B101", "B601"]
