sonar.projectKey=Heretek-AI_heretek-swarm
sonar.organization=heretek-ai
sonar.projectName=heretek-swarm

sonar.sources=backend/heretek_swarm,swarm-dashboard/src,tests
sonar.tests=tests,swarm-dashboard/src/**/__tests__,swarm-dashboard/tests
sonar.python.version=3.11
sonar.javascript.lcov.reportPaths=swarm-dashboard/coverage/lcov.info
sonar.python.coverage.reportPaths=coverage.xml

# Exclude non-product and generated assets
sonar.exclusions=\
  **/.agents/**,\
  **/agent_workspace/**,\
  **/.claude-flow/**,\
  **/node_modules/**,\
  **/__pycache__/**,\
  **/*.egg-info/**,\
  **/dist/**,\
  **/build/**,\
  **/.venv/**,\
  **/scripts/verify-*.sh,\
  **/.agents/skills/**/office/schemas/**,\
  **/plugins/examples.py

sonar.test.exclusions=\
  **/tests/**,\
  **/swarm-dashboard/tests/**,\
  **/*/__tests__/**

# Sonar: float equality in tests is intentional for threshold assertions
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S1244
sonar.issue.ignore.multicriteria.e1.resourceKey=**/tests/**
sonar.issue.ignore.multicriteria.e2.ruleKey=shelldre:S7688
sonar.issue.ignore.multicriteria.e2.resourceKey=**/scripts/**

sonar.coverage.exclusions=\
  **/tests/**,\
  **/swarm-dashboard/tests/**,\
  **/actors/stubs.py,\
  **/plugins/examples.py
