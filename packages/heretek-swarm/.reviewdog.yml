# reviewdog configuration for Heretek Swarm
# See: https://github.com/reviewdog/reviewdog#reviewdog-config-file
#
# Local usage:
#   reviewdog -diff="git diff" -reporter=local
#
# CI usage:
#   reviewdog -reporter=github-pr-check
#   reviewdog -reporter=github-pr-review

runner:
  ruff:
    cmd: ruff check --output-format=concise backend/ tests/
    errorformat:
      - "%f:%l:%c: %m"
    name: ruff
    level: warning

  mypy:
    cmd: mypy backend/ --ignore-missing-imports
    format: mypy
    name: mypy
    level: warning

  eslint:
    cmd: npx eslint swarm-dashboard/ --format stylish
    format: eslint
    name: eslint
    level: warning

  bandit:
    cmd: bandit -r backend/ -f json
    format: bandit
    name: bandit
    level: error

  markdownlint:
    cmd: npx --yes markdownlint-cli '**/*.md' --ignore node_modules --ignore .github --ignore .agents
    errorformat:
      - "%f:%l:%c: %m"
    name: markdownlint
    level: info
