# NATS Server Configuration — Heretek Swarm
# =============================================================================
# Default (development / first-time deploy): plain TCP, no TLS. This matches
# HERETEK_MTLS_ENABLED=false (the default) and the API's plain nats:// URL, so
# `docker compose up` works out of the box without provisioning certificates.
#
# For production mTLS, provision the certs/ key pairs (see secrets/certs.yaml /
# SOPS) and mount nats-server-mtls.conf instead — see the commented tls{} block
# below for the required settings.

port: 4222

# HTTP monitoring port — bound to all interfaces so docker healthcheck works
http_port: 8222

jetstream {
    store_dir: "/data"
}

# -----------------------------------------------------------------------------
# mTLS (G-05 partial — see M030-RUN-LOG.md). Requires the following files
# mounted under /etc/nats/certs/: ca.crt, nats-server.crt,
# nats-server.key, agent.crt, agent.key. Clients (the api + all 23
# agents) connect via tls://nats:4222 and present the agent cert.
# Currently DISABLED because the api's nats-py TLS client fails with
# CERTIFICATE_VERIFY_FAILED ("unable to get local issuer certificate")
# even though ca.crt is loaded as the trust anchor. The cert chain
# generation (openssl x509 -req ...) is correct in principle but the
# runtime integration needs further debugging. Re-enable by
# uncommenting the tls{} block below AND setting HERETEK_MTLS_ENABLED=true.
# -----------------------------------------------------------------------------
# tls {
#     cert_file: "/etc/nats/certs/nats-server-fullchain.crt"
#     key_file:  "/etc/nats/certs/nats-server.key"
#     ca_file:   "/etc/nats/certs/ca.crt"
#     verify:    true
#     timeout:   5.0
# }
