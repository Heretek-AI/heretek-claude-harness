# reviewdog — automated code review annotations on PRs
# Posts linter findings as inline GitHub PR annotations.
# See: https://github.com/reviewdog/reviewdog

name: reviewdog

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  checks: write
  pull-requests: write
  statuses: write

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '22'

jobs:
  ruff:
    name: ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - run: pip install -e ".[dev]"
      - uses: reviewdog/action-setup@d8edfce3dd5e1ec6978745e801f9c50b5ef80252 # v1.4.0
        with:
          reviewdog_version: latest
      - name: Report ruff findings
        run: |
          ruff check --output-format=concise backend/ tests/ |
            reviewdog -efm='%f:%l:%c: %m' -name=ruff -reporter=github-pr-check -level=warning
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ruff-format:
    name: ruff format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - run: pip install -e ".[dev]"
      - uses: reviewdog/action-setup@d8edfce3dd5e1ec6978745e801f9c50b5ef80252 # v1.4.0
        with:
          reviewdog_version: latest
      - name: Report ruff formatting suggestions
        run: |
          ruff format --check --diff backend/ tests/ |
            reviewdog -f=diff -f.diff.strip=1 -name=ruff-format -reporter=github-pr-review -level=warning
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mypy:
    name: mypy type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - run: pip install -e ".[dev]"
      - uses: reviewdog/action-setup@d8edfce3dd5e1ec6978745e801f9c50b5ef80252 # v1.4.0
        with:
          reviewdog_version: latest
      - name: Report mypy findings
        run: |
          mypy backend/ --ignore-missing-imports 2>&1 |
            reviewdog -f=mypy -name=mypy -reporter=github-pr-check -level=warning
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  eslint:
    name: eslint lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: swarm-dashboard/package-lock.json
      - run: npm ci
        working-directory: swarm-dashboard
      - uses: reviewdog/action-setup@d8edfce3dd5e1ec6978745e801f9c50b5ef80252 # v1.4.0
        with:
          reviewdog_version: latest
      - name: Report eslint findings
        run: |
          npx eslint -f stylish swarm-dashboard/ |
            reviewdog -f=eslint -name=eslint -reporter=github-pr-check -level=warning
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bandit:
    name: bandit security lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - run: pip install -e ".[dev]"
      - uses: reviewdog/action-setup@d8edfce3dd5e1ec6978745e801f9c50b5ef80252 # v1.4.0
        with:
          reviewdog_version: latest
      - name: Report bandit findings
        run: |
          bandit -r backend/ -f json |
            reviewdog -f=bandit -name=bandit -reporter=github-pr-check -level=error
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: reviewdog/action-setup@d8edfce3dd5e1ec6978745e801f9c50b5ef80252 # v1.4.0
        with:
          reviewdog_version: latest
      - name: Report markdownlint findings
        run: |
          npx --yes markdownlint-cli '**/*.md' --ignore node_modules --ignore .github --ignore .agents 2>&1 |
            reviewdog -efm='%f:%l:%c: %m' -name=markdownlint -reporter=github-pr-check -level=info
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
