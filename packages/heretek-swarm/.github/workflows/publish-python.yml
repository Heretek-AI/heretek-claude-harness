name: Publish Python Package

on:
  push: { tags: ['v*'] }
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

jobs:
  build:
    name: Build Package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Extract version from tag
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "TAG_VERSION=$TAG_VERSION" >> $GITHUB_ENV
          echo "tag_version=$TAG_VERSION"

      - name: Validate version matches pyproject.toml
        run: |
          FILE_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "FILE_VERSION=$FILE_VERSION"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "ERROR: Tag version '$TAG_VERSION' does not match pyproject.toml version '$FILE_VERSION'"
            echo "Update pyproject.toml to version '$TAG_VERSION' and push a new tag."
            exit 1
          fi
          echo "Version validated: $TAG_VERSION"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=":all:" build

      - name: Build package
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test-install:
    name: Test Installation
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install and test wheel
        run: |
          pip install --only-binary=":all:" dist/*.whl --force-reinstall --no-deps || true
          heretek-swarm --help || true

      - name: Install and test tarball
        run: |
          pip install --only-binary=":all:" dist/*.tar.gz --force-reinstall --no-deps || true
          python -c "import heretek_swarm; print('Import successful')" || echo "Import may have failed but package was built"

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/project/heretek-swarm
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
