# NOTE: For trusted publishing to work, the @heretek-ai npm org must have
# a "Publish" connection to the heretek-swarm repository in npm settings.
# Set up at: https://www.npmjs.com/org/heretek-ai → Settings → Publishing
name: Publish NPM Package

on:
  push: { tags: ['v*'] }
  workflow_dispatch:

env:
  NODE_VERSION: '22'

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract version from tag
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "TAG_VERSION=$TAG_VERSION" >> $GITHUB_ENV
          echo "tag_version=$TAG_VERSION"

      - name: Validate version matches package.json
        working-directory: swarm-dashboard
        run: |
          FILE_VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "FILE_VERSION=$FILE_VERSION"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "ERROR: Tag version '$TAG_VERSION' does not match package.json version '$FILE_VERSION'"
            echo "Update swarm-dashboard/package.json to version '$TAG_VERSION' and push a new tag."
            exit 1
          fi
          echo "Version validated: $TAG_VERSION"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        working-directory: swarm-dashboard
        run: npm ci

      - name: Build
        working-directory: swarm-dashboard
        run: npm run build

      - name: Publish to npm
        run: cd swarm-dashboard && npm publish --ignore-scripts --access public --provenance
