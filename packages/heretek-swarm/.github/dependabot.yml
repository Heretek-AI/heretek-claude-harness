version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    labels:
      - "dependencies"
      - "python"
    assignees:
      - "Heretek-AI/core-team"
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    groups:
      fastapi:
        patterns:
          - "fastapi*"
          - "starlette*"
          - "uvicorn*"
      testing:
        patterns:
          - "pytest*"
          - "coverage*"
          - "hypothesis*"
      linting:
        patterns:
          - "ruff*"
          - "mypy*"
          - "pre-commit*"

  # Python dependencies (agent app)
  - package-ecosystem: "pip"
    directory: "/heretek-swarm/apps/agent"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    labels:
      - "dependencies"
      - "python"
      - "agent"
    open-pull-requests-limit: 10

  # Frontend dependencies
  - package-ecosystem: "npm"
    directory: "/swarm-dashboard"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    labels:
      - "dependencies"
      - "javascript"
    assignees:
      - "Heretek-AI/frontend-team"
    open-pull-requests-limit: 10
    groups:
      react:
        patterns:
          - "react*"
          - "@types/react*"
      vite:
        patterns:
          - "vite*"
          - "@vitejs/*"
      testing-frontend:
        patterns:
          - "playwright*"
          - "@playwright/*"
          - "vitest*"

  # Docker images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    labels:
      - "dependencies"
      - "docker"
    assignees:
      - "Heretek-AI/devops-team"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    labels:
      - "dependencies"
      - "ci-cd"
    assignees:
      - "Heretek-AI/devops-team"
