    -----BEGIN CERTIFICATE-----
    PLACEHOLDER
    -----END CERTIFICATE-----
  key: |
    -----BEGIN PRIVATE KEY-----
    PLACEHOLDER
    -----END PRIVATE KEY-----

# Per-agent certificates issued by the root CA.
