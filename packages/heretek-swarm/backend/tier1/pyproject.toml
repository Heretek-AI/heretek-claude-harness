[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "tier1"
version = "0.1.0"
description = "Tier 1 Core Triad deliberation MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pydantic-ai>=0.0.30",
    "langgraph>=0.0.40",
    "nats-py>=2.6",
    "asyncpg>=0.29",
    "redis>=5.0",
    "qdrant-client>=1.7",
    "cognee>=0.1.0",
    "mem0ai>=0.1.0",
    "httpx>=0.27",
    "kuzu>=0.4",
    "openai>=1.0",
    "structlog>=24.1",
    "tenacity>=8.2",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp>=1.24",
    "opentelemetry-instrumentation-fastapi>=0.45",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "freezegun>=1.4",
    "ruff>=0.4",
    "mypy>=1.10",
    "respx>=0.21",
    "docker>=7.1",
    "vcrpy>=6.0",
    "hypothesis>=6.80",
]

[project.scripts]
tier1 = "tier1.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["tier1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=tier1 --cov-report=term-missing --cov-fail-under=80 -m 'not integration'"
markers = [
    "integration: real-provider tests, env-gated; skipped by default in PR CI",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
