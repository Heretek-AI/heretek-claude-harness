[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

# heretek-swarm-api — the FastAPI HTTP surface.
#
# Phase 4 of PLAN.md (§1.13) carves this out of the single
# heretek-swarm package. The contents listed below are the
# sub-packages that move from backend/heretek_swarm/ into the
# new api package's src/heretek_swarm_api/ namespace:
#
#   api/              — FastAPI application entry point + 22+ routers
#   observability/    — opik_compat, alerting, db_timing,
#                        metrics, prometheus_metrics, timing
#   security/         — auth (zero_trust, adversarial,
#                        ddos_protection, guardrails,
#                        anomaly_detection, behavioral_baseline,
#                        baseline_update, threat_detection,
#                        validators, safe01)
#   mcp/              — MCP server + tools
#   integrations/     — third-party connectors
#   plugins/          — plugin system
#   rag/              — RAG orchestration-specific bits
#   agents/           — agent registration HTTP (routing_control,
#                        supervisor, core, instances, lifecycle,
#                        profiling, routing_rules, jetstream, chat)
#
# The package depends on heretek-swarm-core. The dashboard
# (if/when it exists) depends on this package's HTTP surface.
#
# This pyproject.toml is a stub. Activating the split requires:
#   1. Moving the listed sub-packages from backend/heretek_swarm/
#      into src/heretek_swarm_api/
#   2. Updating internal imports to use the new namespace
#   3. Setting [tool.uv.workspace] members in the root
#      pyproject.toml to include this directory
#   4. Adding heretek-swarm-core to this package's deps

[project]
name = "heretek-swarm-api"
version = "0.2.0"
description = "Heretek Swarm v2.0 - FastAPI HTTP surface (routers, observability, security middleware)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Heretek AI", email = "engineering@heretek.ai"}
]

# Stub dependencies — the real list is inherited from the
# root pyproject.toml today; the actual split would re-derive
# it from the moved sub-packages' import graph.
dependencies = [
    "heretek-swarm-core>=0.2.0",
    "fastapi>=0.136.3",
    "uvicorn>=0.48.0",
    "starlette>=1.2.1",
    "pydantic>=2.13.4",
    "httpx>=0.28.1",
    "redis>=8.0.0",
    "qdrant-client>=1.18.0",
    "opentelemetry-api>=1.42.1",
    "opentelemetry-sdk>=1.42.1",
    "prometheus-client>=0.25.0",
    "structlog>=25.5.0",
    "tenacity>=9.1.4",
    "slowapi>=0.1.9",
]

[project.urls]
Homepage = "https://github.com/heretek-ai/heretek-swarm"
Repository = "https://github.com/heretek-ai/heretek-swarm"

[tool.setuptools.packages.find]
where = ["src"]
include = ["heretek_swarm_api*"]

[tool.uv.sources]
heretek-swarm-core = { workspace = true }
