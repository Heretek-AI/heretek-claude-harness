name: security-scan (PR required check)

on:
  pull_request:
    branches: [main]
    paths: ['catalog/catalog.yaml']

permissions:
  contents: read

jobs:
  scan-pr:
    name: Re-run scanners against bumped item
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2 # D20
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.3.0 # D20
        with:
          python-version: "3.12"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v5.0.0 # D20
        with:
          node-version: "20"

      - name: Install Python deps
        run: pip install -r requirements-dev.txt

      - name: Determine bumped item
        id: detect
        run: |
          # Find the item id whose sha changed in the PR diff
          ITEM_ID=$(git diff origin/main..HEAD -- catalog/catalog.yaml | \
            grep -E '^\- *sha: ' | head -1 | sed -E 's/.*id: ([a-z0-9-]+).*/\1/' || true)
          if [ -z "$ITEM_ID" ]; then
            ITEM_ID=$(git diff origin/main..HEAD -- catalog/catalog.yaml | \
              grep -E '^[+-] *sha: ' | tail -1 | awk '{print $3}' | tr -d '"')
          fi
          echo "item_id=$ITEM_ID" >> "$GITHUB_OUTPUT"

      - name: Run scanner against bumped item
        if: steps.detect.outputs.item_id != ''
        env:
          VT_TOKEN: ${{ secrets.VT_TOKEN }}
        run: |
          python scripts/security_scan.py \
            --item "${{ steps.detect.outputs.item_id }}" \
            --dry-run \
            --vt-token "$VT_TOKEN" \
            --output reports/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2 # D20
        if: always()
        with:
          name: pr-scan-reports
          path: reports/

      - name: Open emergency issue on failure (spec §8.5)
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7.0.1 # D20
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const prRef = context.payload.pull_request ? ` PR #${context.payload.pull_request.number}` : '';
            const title = `security-scan PR check failed${prRef} on ${new Date().toISOString().slice(0,10)}`;
            const body = [
              `The PR security-scan check failed.`,
              ``,
              `**Run:** ${runUrl}`,
              `**Job:** ${context.job}`,
              `**PR:** ${context.payload.pull_request ? context.payload.pull_request.html_url : 'n/a'}`,
              ``,
              `See the run logs for the scanner findings.`,
              ``,
              `### Labels`,
              ``,
              `<!-- security-scan,emergency,spec-§8.5 -->`,
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security-scan,emergency',
              per_page: 5,
            });
            const dup = existing.data.find(i => i.title === title);
            if (dup) {
              core.info(`emergency issue already open: #${dup.number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['security-scan', 'emergency'],
              });
            }
