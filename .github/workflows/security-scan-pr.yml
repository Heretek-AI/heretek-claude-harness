name: security-scan (PR required check)

on:
  pull_request:
    branches: [main]
    paths: ['catalog/catalog.yaml']

permissions:
  contents: read

jobs:
  scan-pr:
    name: Re-run scanners against bumped item
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 # D20
        with:
          fetch-depth: 0

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0 # D20
        with:
          python-version: "3.12"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 # D20
        with:
          node-version: "20"

      - name: Install Python deps
        run: pip install -r requirements-dev.txt

      - name: Determine bumped item
        id: detect
        run: |
          # Find the item id whose sha changed in the PR diff
          ITEM_ID=$(git diff origin/main..HEAD -- catalog/catalog.yaml | \
            grep -E '^\- *sha: ' | head -1 | sed -E 's/.*id: ([a-z0-9-]+).*/\1/' || true)
          if [ -z "$ITEM_ID" ]; then
            ITEM_ID=$(git diff origin/main..HEAD -- catalog/catalog.yaml | \
              grep -E '^[+-] *sha: ' | tail -1 | awk '{print $3}' | tr -d '"')
          fi
          echo "item_id=$ITEM_ID" >> "$GITHUB_OUTPUT"

      - name: Run scanner against bumped item
        if: steps.detect.outputs.item_id != ''
        env:
          VT_TOKEN: ${{ secrets.VT_TOKEN }}
        run: |
          python scripts/security_scan.py \
            --item "${{ steps.detect.outputs.item_id }}" \
            --dry-run \
            --vt-token "$VT_TOKEN" \
            --output reports/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 # D20
        if: always()
        with:
          name: pr-scan-reports
          path: reports/
