name: validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"   # Mondays at 06:00 UTC (weekly refresh)
  workflow_dispatch:

jobs:
  validate:
    name: Validate marketplace + manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          # fast-gate tests assert on real subprocess timeout propagation, so the
          # dispatcher's binary-resolution path must succeed. Mirrors the
          # ruff install in .github/workflows/smoke-test.yml.
          pip install ruff

      - name: Run schema validation
        run: python scripts/validate.py

      - name: Regenerate marketplace.json
        run: python scripts/generate_marketplace.py

      - name: Assert catalog.yaml → marketplace.json is in sync
        run: |
          if ! git diff --exit-code .claude-plugin/marketplace.json; then
            echo "::error::marketplace.json is out of sync with catalog.yaml."
            echo "::error::Run 'python scripts/generate_marketplace.py' locally and commit the result."
            exit 1
          fi

      - name: Run hooks plugin tests + smoke
        run: |
          pytest tests/test_fast_gate.py \
                 tests/test_quality_gate.py \
                 tests/test_hooks_manifest.py \
                 tests/test_install_git_hooks.py \
                 tests/test_aitmpl_vetting.py
          bash tests/smoke/fast_gate_smoke.sh

      - name: Check plugins have content
        run: |
          python -c "
          import sys, yaml
          from pathlib import Path
          catalog = yaml.safe_load(Path('catalog/catalog.yaml').read_text())
          for p in catalog['plugins']:
              name = p['name']
              items = p.get('items') or []
              assert items, f'{name}: no items — every plugin must have ≥ 1 vetted item'
              # Approved items must have corresponding content directories
              for item in items:
                  if item.get('vetting', {}).get('status') != 'approved':
                      continue
                  kind = item['kind']
                  # We just assert the item has at minimum upstream + license; further
                  # content-shape assertions live in tests/test_plugin_components.py
                  assert item.get('upstream'), f'{name}/{item["id"]}: approved item missing upstream'
                  assert item.get('license'), f'{name}/{item["id"]}: approved item missing license'
          print(f'all {len(catalog["plugins"])} plugins have vetted items')
          "

      - name: Run tests
        run: pytest

  refresh-pins:
    name: Quarterly SHA refresh check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only run on schedule or manual dispatch — NOT on push or PR (this is a
    # maintenance check, not a gate; non-fresh items are flagged for review).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements-dev.txt

      - name: Run refresh-pins check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/refresh_pins.py --github-token "$GITHUB_TOKEN" | tee refresh-pins.txt
          RC=${PIPESTATUS[0]}
          echo "## refresh-pins summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          head -50 refresh-pins.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ $RC -ne 0 ]; then
            echo "::warning::Some items are stale. See refresh-pins.txt for details. Maintainer should review."
          fi
          # Exit non-zero so the job fails visibly. This is a maintenance signal,
          # not a merge gate (PRs still merge even when this job fails).
          exit $RC
