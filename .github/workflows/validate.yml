name: validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"   # Mondays at 06:00 UTC (weekly refresh)
  workflow_dispatch:

# Default permissions: read-only. `refresh-pins` only needs to call public
# GitHub API GET endpoints and write $GITHUB_STEP_SUMMARY (which is a
# built-in, not a token permission), so contents:read is sufficient.
permissions:
  contents: read

jobs:
  validate:
    name: Validate marketplace + manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=:all: -r requirements-dev.txt
          # fast-gate tests assert on real subprocess timeout propagation, so the
          # dispatcher's binary-resolution path must succeed. Mirrors the
          # ruff install in .github/workflows/smoke-test.yml.
          pip install --only-binary=:all: ruff==0.16.1

      - name: Install ast-grep (required for profile_aware e2e tests)
        env:
          # SHA-256 of app-x86_64-unknown-linux-gnu.zip from ast-grep 0.45.1.
          # Pin to a known-good release; verify before extracting.
          AST_GREP_VERSION: "0.45.1"
          AST_GREP_SHA256: "76fb6555be6734fb5057dba8d2fb756430f374bb9e1af694cf1ce00e13238d63"
        run: |
          set -euo pipefail
          curl -fsSL --proto "=https" --tlsv1.2 \
            -o /tmp/ast-grep.zip \
            "https://github.com/ast-grep/ast-grep/releases/download/${AST_GREP_VERSION}/app-x86_64-unknown-linux-gnu.zip"
          echo "${AST_GREP_SHA256}  /tmp/ast-grep.zip" | sha256sum -c -
          mkdir -p "$HOME/.cargo/bin"
          unzip -o /tmp/ast-grep.zip -d "$HOME/.cargo/bin"
          rm /tmp/ast-grep.zip
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Verify ast-grep reachable
        run: command -v ast-grep

      - name: Run schema validation
        run: python scripts/validate.py

      - name: Regenerate marketplace.json
        run: python scripts/generate_marketplace.py

      - name: Assert catalog.yaml → marketplace.json is in sync
        run: |
          if ! git diff --exit-code .claude-plugin/marketplace.json; then
            echo "::error::marketplace.json is out of sync with catalog.yaml."
            echo "::error::Run 'python scripts/generate_marketplace.py' locally and commit the result."
            exit 1
          fi

      - name: Run hooks plugin tests + smoke
        run: |
          pytest tests/test_fast_gate.py \
                 tests/test_quality_gate.py \
                 tests/test_hooks_manifest.py \
                 tests/test_install_git_hooks.py \
                 tests/test_aitmpl_vetting.py
          bash tests/smoke/fast_gate_smoke.sh

      - name: Check plugins have content
        run: |
          python -c "
          import sys, yaml
          from pathlib import Path
          catalog = yaml.safe_load(Path('catalog/catalog.yaml').read_text())
          for p in catalog['plugins']:
              name = p['name']
              items = p.get('items') or []
              assert items, f'{name}: no items — every plugin must have ≥ 1 vetted item'
              # Approved items must have corresponding content directories
              for item in items:
                  if item.get('vetting', {}).get('status') != 'approved':
                      continue
                  kind = item['kind']
                  # We just assert the item has at minimum upstream + license; further
                  # content-shape assertions live in tests/test_plugin_components.py
                  assert item.get('upstream'), f'{name}/{item["id"]}: approved item missing upstream'
                  assert item.get('license'), f'{name}/{item["id"]}: approved item missing license'
          print(f'all {len(catalog[\"plugins\"])} plugins have vetted items')
          "

      - name: Run tests
        run: pytest

  freshness-eval:
    name: Freshness eval (#38)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements-dev.txt

      - name: Populate freshness cache
        run: python -m scripts.freshness_index --all

      - name: Run freshness eval
        run: pytest tests/freshness_eval/ -v

  refresh-pins:
    name: Quarterly SHA refresh check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only run on schedule or manual dispatch — NOT on push or PR (this is a
    # maintenance check, not a gate; non-fresh items are flagged for review).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements-dev.txt

      - name: Run refresh-pins check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/refresh_pins.py --github-token "$GITHUB_TOKEN" | tee refresh-pins.txt
          RC=${PIPESTATUS[0]}
          echo "## refresh-pins summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          head -50 refresh-pins.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ $RC -ne 0 ]; then
            echo "::warning::Some items are stale. See refresh-pins.txt for details. Maintainer should review."
          fi
          # Exit non-zero so the job fails visibly. This is a maintenance signal,
          # not a merge gate (PRs still merge even when this job fails).
          exit $RC
