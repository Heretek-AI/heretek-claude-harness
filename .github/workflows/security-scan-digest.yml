name: security-scan (weekly digest)

on:
  schedule:
    - cron: '0 9 * * 1'   # Monday 09:00 UTC
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 # D20

      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1 # D20
        with:
          script: |
            const since = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString();
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed',
              labels: 'security-scan',
              since: since,
              per_page: 100,
            });
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security-scan',
              per_page: 100,
            });
            const title = `Weekly security-scan digest (week of ${since.slice(0,10)})`;
            const body = [
              `## Closed this week`,
              issues.data.length === 0 ? '_none_' : issues.data.map(i => `- #${i.number} ${i.title}`).join('\n'),
              ``,
              `## Still open`,
              open.data.length === 0 ? '_none_' : open.data.map(i => `- #${i.number} ${i.title}`).join('\n'),
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['security-scan', 'digest'],
            });
