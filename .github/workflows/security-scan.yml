name: security-scan (daily)

on:
  schedule:
    - cron: '17 3 * * *'   # 03:17 UTC daily
    # Weekly Monday 06:00 UTC, after the validate.yml cron
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Default permissions: read-only. Per-job `permissions:` blocks elevate only
# where needed (SonarCloud S8233).
permissions:
  contents: read

jobs:
  scan:
    name: Run per-kind scanners against latest upstream
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write           # draft PR
      issues: write             # tracking issue
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2 # D20

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.3.0 # D20
        with:
          python-version: "3.12"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v5.0.0 # D20
        with:
          node-version: "20"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=:all: -r requirements-dev.txt

      - name: Warm SkillSpector npx cache
        run: npx --yes @nvidia/skillspector --version

      - name: Run security scan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VT_TOKEN: ${{ secrets.VT_TOKEN }}
        run: |
          python scripts/security_scan.py \
            --output reports/ \
            --github-token "$GH_TOKEN" \
            --vt-token "$VT_TOKEN"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2 # D20
        if: always()
        with:
          name: scan-reports
          path: reports/

      - name: Open emergency issue on failure (spec §8.5)
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7.0.1 # D20
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `security-scan failed on ${new Date().toISOString().slice(0,10)}`;
            const body = [
              `The daily security-scan workflow failed.`,
              ``,
              `**Run:** ${runUrl}`,
              `**Job:** ${context.job}`,
              ``,
              `Please check the run logs and triage. Duplicate issue detection:`,
              `if an issue with this title is already open, the workflow will`,
              `leave it in place instead of opening a new one.`,
              ``,
              `### Labels`,
              ``,
              `<!-- security-scan,emergency,spec-§8.5 -->`,
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security-scan,emergency',
              per_page: 5,
            });
            const dup = existing.data.find(i => i.title === title);
            if (dup) {
              core.info(`emergency issue already open: #${dup.number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['security-scan', 'emergency'],
              });
            }

  freshness-index:
    name: Refresh freshness index
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write           # git push
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2 # D20
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.3.0 # D20
        with:
          python-version: "3.10"
      - name: Install runtime deps
        run: "pip install --only-binary :all: -r requirements-dev.txt"
      - name: Refresh freshness cache
        run: python -m scripts.freshness_index --all
      - name: Commit refreshed cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add catalog/freshness/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore(freshness): nightly cache refresh"
            git push
          fi
