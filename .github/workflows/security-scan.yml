name: security-scan (daily)

on:
  schedule:
    - cron: '17 3 * * *'   # 03:17 UTC daily
    # Weekly Monday 06:00 UTC, after the validate.yml cron
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write           # draft PR
  issues: write             # tracking issue
  pull-requests: write

jobs:
  scan:
    name: Run per-kind scanners against latest upstream
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 # D20

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0 # D20
        with:
          python-version: "3.12"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 # D20
        with:
          node-version: "20"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Warm SkillSpector npx cache
        run: npx --yes @nvidia/skillspector --version

      - name: Run security scan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VT_TOKEN: ${{ secrets.VT_TOKEN }}
        run: |
          python scripts/security_scan.py \
            --output reports/ \
            --github-token "$GH_TOKEN" \
            --vt-token "$VT_TOKEN"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 # D20
        if: always()
        with:
          name: scan-reports
          path: reports/

  freshness-index:
    name: Refresh freshness index
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install runtime deps
        run: pip install -r requirements.txt
      - name: Refresh freshness cache
        run: python -m scripts.freshness_index --all
      - name: Commit refreshed cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add catalog/freshness/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore(freshness): nightly cache refresh"
            git push
          fi
