name: Publish Marketplace Catalog

on:
  push:
    branches:
      - main
    paths:
      - 'catalog/**'
      - 'plugins/**'
      - '.claude-plugin/**'
      - 'scripts/**'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema

      - name: Build & Validate Marketplace Catalog
        run: |
          python scripts/heretek_cli.py build-catalog
          python scripts/heretek_cli.py validate

      - name: Prepare Pages Directory
        run: |
          mkdir -p _site
          cp .claude-plugin/marketplace.json _site/marketplace.json
          cp -r plugins _site/plugins

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
