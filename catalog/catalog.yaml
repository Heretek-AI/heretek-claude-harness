# heretek marketplace — source of truth.
# Generated from this file by scripts/generate_marketplace.py; do NOT
# hand-edit .claude-plugin/marketplace.json (it's regenerated).
#
# Schema: see tests/schemas/marketplace.schema.json (for the generated
# marketplace.json) and tests/fixtures/catalog/* (for the catalog.yaml
# structure). Every items[] entry must pass D7 vetting; entries without
# vetting.status: approved + review link fail CI.

marketplace:
  name: heretek
  description: "Opinionated Claude Code harness: task plugins, quality-gate hooks, curated MCP/LSP/skills."
  owner:
    name: Heretek-AI
    email: team@heretek.ai
  metadata:
    pluginRoot: "./plugins"
  allowCrossMarketplaceDependenciesOn:
    - claude-plugins-official

plugins:
  - name: rust
    category: task
    tags: [rust, language]
    source: { type: relative, path: rust }
    components: [skills, lsp]
    items:
      - id: rust-analyzer
        kind: lsp
        upstream: rust-lang/rust-analyzer
        sha: "987d712f743ecf3651180735a8189b8cb398ec0a"
        license: MIT
        vetting:
          status: approved
          date: 2026-08-04
          stars: 16724
          last_commit: 2026-08-04
          cve_scan: 2026-08-04
          review: reviews/rust-analyzer.md
      - id: cargo-check
        kind: skill
        upstream: rust-lang/cargo
        sha: "first-party-skill"
        license: MIT
        vetting:
          status: approved
          date: 2026-08-04
          stars: 13000
          last_commit: 2026-08-04
          cve_scan: not-applicable
          review: reviews/rust-cargo-check.md
      - id: cargo-clippy
        kind: skill
        upstream: rust-lang/rust-clippy
        sha: "8c34b94d986619698fd3b4c2c0eb287aeac97d79"
        license: MIT
        vetting:
          status: approved
          date: 2026-08-04
          stars: 13424
          last_commit: 2026-08-04
          cve_scan: 2026-08-04
          review: reviews/rust-clippy.md

  - name: python
    category: task
    tags: [python, language]
    source: { type: relative, path: python }
    components: [skills, lsp]
    items:
      - id: ruff-lsp
        kind: lsp
        upstream: astral-sh/ruff
        sha: "e49143a56844560165df2b869a77da80858bca9f"
        license: MIT
        vetting:
          status: approved
          date: 2026-08-04
          stars: 49068
          last_commit: 2026-08-04
          cve_scan: 2026-08-04
          review: reviews/python-ruff.md
      - id: ruff-check
        kind: skill
        upstream: astral-sh/ruff
        sha: "e49143a56844560165df2b869a77da80858bca9f"
        license: MIT
        vetting:
          status: approved
          date: 2026-08-04
          stars: 49068
          last_commit: 2026-08-04
          cve_scan: 2026-08-04
          review: reviews/python-ruff.md

  - name: js-ts
    category: task
    tags: [javascript, typescript]
    source: { type: relative, path: js-ts }
    components: [skills, lsp]
    items: []

  - name: web-frontend
    category: task
    tags: [frontend, design]
    source: { type: relative, path: web-frontend }
    components: [skills, mcp]
    items: []

  - name: hooks
    category: cross
    tags: [hooks, quality-gates, flagship]
    source: { type: relative, path: hooks }
    components: [hooks, commands, git-hooks]
    items:
      - id: heretek-fast-gate
        kind: hook
        upstream: Heretek-AI/heretek-claude-harness
        sha: "694449d"  # the SP2 merge commit (self-pinning to the version that ships the hook)
        license: MIT
        vetting:
          status: approved
          date: 2026-08-04
          stars: 0  # this is the heretek repo itself; not subject to D7 stars gate
          last_commit: 2026-08-04
          cve_scan: not-applicable  # first-party
          review: reviews/0000-template.md  # SP1 ADR template serves as the self-reference

  - name: security
