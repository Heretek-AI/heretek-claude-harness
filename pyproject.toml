[project]
name = "heretek-marketplace"
version = "0.0.0"
description = "Opinionated Claude Code plugin marketplace (heretek)"
requires-python = ">=3.10"
dependencies = [
    "PyYAML==6.0.3",
    "jsonschema==4.26.0",
    "requests==2.34.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
