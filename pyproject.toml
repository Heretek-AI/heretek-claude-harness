[project]
name = "heretek-marketplace"
version = "0.0.0"
description = "Opinionated Claude Code plugin marketplace (heretek)"
requires-python = ">=3.10"
dependencies = [
    "PyYAML==6.0.3",
    "jsonschema==4.26.0",
    "requests==2.34.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -m \"not integration\""
markers = [
    "integration: tests that require external scanners / network / secrets (run with `pytest -m integration`)",
]

[tool.coverage]
xml_output = "coverage.xml"

# Ruff config — wired into plugins/hooks/.pre-commit-config.yaml.
# Aligns with the repo's existing style (single-letter loop vars, late
# imports for sys.path manipulation, fixtures with intentional bad code).
[tool.ruff]
line-length = 100
exclude = ["tests/fixtures/fast_gate/**"]

[tool.ruff.lint]
# Ignore rules that conflict with existing codebase design patterns
ignore = ["E741", "PLW1510", "DTZ011", "SIM117", "TRY004", "BLE001", "TRY401", "EXE002", "PERF102", "PLC3002", "B018", "S112"]

[tool.ruff.lint.per-file-ignores]
# Sample catalog fixtures intentionally contain unpinned references
"tests/fixtures/refresh_pins/**" = ["F821", "F841", "E402"]
# Hook scripts and test files manipulate sys.path before importing modules
"plugins/hooks/scripts/**" = ["E402"]
"tests/**" = ["E402"]

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
extraPaths = [".", "scripts", "plugins/hooks/scripts"]
exclude = [".venv", "build", ".claude", ".agents", "tests/fixtures", "tests/**/fixtures", "plugins/**/fixtures"]
reportMissingImports = true
reportMissingTypeStubs = false
