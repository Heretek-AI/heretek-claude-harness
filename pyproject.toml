[project]
name = "heretek-marketplace"
version = "0.1.0"
description = "Plugin Marketplace & Distribution Engine for Claude Code Guardrails"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyright>=1.1.350",
    "ruff>=0.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage]
xml_output = "coverage.xml"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["tests/fixtures/**"]

[tool.ruff.lint]
ignore = ["E741", "PLW1510", "DTZ011", "SIM117", "TRY004", "BLE001", "TRY401", "EXE002", "PERF102", "PLC3002", "B018", "S112"]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["E402"]
"plugins/hooks/scripts/**" = ["E402"]
"tests/**" = ["E402"]

[tool.basedpyright]
pythonVersion = "3.10"
typeCheckingMode = "strict"
extraPaths = [".", "scripts", "plugins/hooks/scripts"]
exclude = [".venv", "build", ".claude", ".agents", "tests/fixtures", "tests/**/fixtures", "plugins/**/fixtures"]
reportMissingImports = true
reportMissingTypeStubs = false
