site_name: Android-RE
site_description: Claude Code skills and MCP servers for Android APK reverse engineering
site_url: https://heretek-ai.github.io/Android-RE/
repo_url: https://github.com/Heretek-AI/Android-RE
repo_name: Heretek-AI/Android-RE

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - MCP Tool Reference: mcp-tool-reference.md
  - Skills: skills.md
  - Authoring:
      - Skill Authoring: skill-authoring.md
      - Contributing a Tool: contributing-a-tool.md
  - Operations:
      - Security Model: security-model.md
      - ADB Setup: adb-setup.md
      - Frida Server Versions: frida-server-versions.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.details

plugins:
  - search
