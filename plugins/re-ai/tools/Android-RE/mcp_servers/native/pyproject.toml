[project]
name = "android-re-mcp-native"
version = "0.1.0"
description = "MCP server for native Android binary analysis (LIEF 0.17.6)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.15"
authors = [
  { name = "The Android-RE Authors" },
]
keywords = ["android", "mcp", "lief", "elf", "native", "reverse-engineering"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

dependencies = [
  "android-re-core",
  "mcp>=1.27,<2",
]

[project.scripts]
android-re-mcp-native = "android_re_mcp_native.__main__:main"

[project.urls]
Homepage = "https://github.com/Heretek-AI/Android-RE"
Issues = "https://github.com/Heretek-AI/Android-RE/issues"
Source = "https://github.com/Heretek-AI/Android-RE"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/android_re_mcp_native"]

[tool.uv]
android-re-core = { workspace = true }
