[project]
name = "android-re-mcp-static"
version = "0.1.0"
description = "MCP server for static Android APK analysis (androguard, apktool, jadx)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.15"
authors = [
  { name = "The Android-RE Authors" },
]
keywords = [
  "android",
  "mcp",
  "reverse-engineering",
  "apk",
  "static-analysis",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

dependencies = [
  "android-re-core",
  "mcp>=1.27,<2",
]

[project.scripts]
android-re-mcp-static = "android_re_mcp_static.__main__:main"

[project.urls]
Homepage = "https://github.com/Heretek-AI/Android-RE"
Issues = "https://github.com/Heretek-AI/Android-RE/issues"
Source = "https://github.com/Heretek-AI/Android-RE"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/android_re_mcp_static"]

[tool.uv]
# Pull android-re-core from the local workspace.
android-re-core = { workspace = true }
