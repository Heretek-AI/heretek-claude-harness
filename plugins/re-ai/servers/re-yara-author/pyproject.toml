[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "re-yara-author"
version = "0.1.0"
description = "MCP server for authoring YARA rules from binary samples: distinctive feature extraction, candidate ranking, rule emission, validation against a positive/negative set. Wraps re-lief + re-yara. Pure-Python, vendor-neutral."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ['mcp', 'yara', 'rule-authoring', 'detection', 'binary-analysis']
authors = [{name = "John"}]
dependencies = ['mcp[cli]>=1.2', 'pydantic>=2.6']

[project.scripts]
re-yara-author = "re_yara_author.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
