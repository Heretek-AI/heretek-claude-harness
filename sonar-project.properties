# SonarCloud configuration for Heretek-AI/heretek-claude-harness.
#
# Excludes pythonsecurity:S8707 / S8705 in CLI scripts invoked by trusted
# maintainers / the daily security-scan workflow. These rules are
# designed for code that LLMs execute directly with CLI arguments; in our
# context the affected scripts (catalog_updater, generate_marketplace,
# refresh_pins, security_scan) only receive CLI args from trusted
# sources. Per the project's #141 remediation plan, the inline
# `# nosonar` markers on these lines were the first attempt; Sonar's
# issue textRange for S8707 is on the sub-expression (e.g.
# `catalog_path.read_text()`), which the inline marker cannot suppress
# when the function call is embedded inside another expression. The
# project-level exclusion below is the cleaner, more durable fix.
#
# See docs/superpowers/specs/2026-08-08-sonar-remediation-design.md
# sections 4 + 7 for the rationale.

sonar.issue.ignore.multicriteria.e1.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.e1.resourceKey=**/catalog_updater.py
sonar.issue.ignore.multicriteria.e2.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.e2.resourceKey=**/generate_marketplace.py
sonar.issue.ignore.multicriteria.e3.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.e3.resourceKey=**/refresh_pins.py
sonar.issue.ignore.multicriteria.e4.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.e4.resourceKey=**/security_scan.py
sonar.issue.ignore.multicriteria.e5.ruleKey=pythonsecurity:S8705
sonar.issue.ignore.multicriteria.e5.resourceKey=**/security_scan.py

# Lockfile dependency predictability (S8565): SonarCloud's lockfile
# detector only recognizes uv.lock / poetry.lock / pdm.lock / pylock.toml.
# Our pip-compile-generated requirements.lock.txt is equivalent but the
# detector doesn't recognize it. Add exclusion for pyproject.toml so the
# Quality Gate doesn't fail on this false-positive.
sonar.issue.ignore.multicriteria.e6.ruleKey=text:S8565
sonar.issue.ignore.multicriteria.e6.resourceKey=**/pyproject.toml

# npm lifecycle scripts (S2648): the smoke-test workflow installs
# @anthropic-ai/claude-code WITHOUT --ignore-scripts because the
# postinstall builds the native binary the runtime needs. The version
# is pinned (@anthropic-ai/claude-code@2.1.227) from the official
# anthropics org; accepting the lifecycle-script risk is a deliberate
# trade-off, not an oversight. Project-level exclusion below matches
# the pattern used for the pythonsecurity suppressions above.
sonar.issue.ignore.multicriteria.e7.ruleKey=typescript:S2648
sonar.issue.ignore.multicriteria.e7.resourceKey=**/smoke-test.yml
